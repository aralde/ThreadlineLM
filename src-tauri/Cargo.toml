[package]
name = "threadlinelm"
version = "0.1.0"
edition = "2021"
description = "Offline forensic viewer for LLM agent traces (Tauri backend)."
license = "MIT"
repository = "https://github.com/adeibe/ThreadlineLM"
homepage = "https://github.com/adeibe/ThreadlineLM"
authors = ["aralde <80920987+aralde@users.noreply.github.com>"]
readme = "../README.md"

[lib]
name = "threadlinelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
once_cell = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
