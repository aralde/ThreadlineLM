name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # webkit2gtk 4.1 is the Tauri 2 requirement (4.0 is for Tauri 1).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ThreadlineLM ${{ github.ref_name }}"
          releaseBody: |
            ThreadlineLM runs fully offline: no network, no telemetry. Pick the file for your platform:

            | Platform | File |
            |---|---|
            | Windows (installer) | `ThreadlineLM_*_x64-setup.exe` or `.msi` |
            | Windows (portable, no install) | `ThreadlineLM_*_x64-portable.exe` |
            | macOS Apple Silicon | `ThreadlineLM_*_aarch64.dmg` |
            | macOS Intel | `ThreadlineLM_*_x64.dmg` |
            | Linux | `.AppImage`, `.deb` or `.rpm` |

            The binaries are not code-signed yet. On Windows, SmartScreen may warn: choose **More info → Run anyway**. On macOS, run `xattr -dr com.apple.quarantine /Applications/ThreadlineLM.app` after installing.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action only uploads installers; also ship the bare .exe it built.
      - name: Upload portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="ThreadlineLM_${GITHUB_REF_NAME#v}_x64-portable.exe"
          cp src-tauri/target/release/threadlinelm.exe "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
